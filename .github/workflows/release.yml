name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: zentao-cli-linux-x86_64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: zentao-cli-darwin-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: zentao-cli-darwin-arm64
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            artifact_name: zentao-cli-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package for Linux/macOS
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          mkdir -p release
          cd target/${{ matrix.target }}/release
          tar czf ../../../release/${{ matrix.artifact_name }}.tar.gz zentao-cli

      - name: Package for Windows
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/zentao-cli.exe release/${{ matrix.artifact_name }}

      - name: Upload artifact (Linux/macOS)
        if: matrix.runner != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.runner == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}
          if-no-files-found: error

  package-skills:
    name: Package Skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package skills
        run: |
          mkdir -p release
          tar czf release/skills.tar.gz skills/

      - name: Upload skills
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: release/skills.tar.gz

  create-release:
    name: Create Release
    needs: [release, package-skills]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ZenTao CLI ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Assets
    needs: [release, package-skills, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload install script
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux x86_64
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} artifacts/zentao-cli-linux-x86_64.tar.gz --clobber

      - name: Upload macOS x86_64
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} artifacts/zentao-cli-darwin-x86_64.tar.gz --clobber

      - name: Upload macOS arm64
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} artifacts/zentao-cli-darwin-arm64.tar.gz --clobber

      - name: Upload Windows
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} artifacts/zentao-cli-windows-x86_64.exe --clobber

      - name: Upload Skills
        run: |
          gh release upload ${{ needs.create-release.outputs.version }} artifacts/skills.tar.gz --clobber

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [release, package-skills]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract binaries for npm
        run: |
          mkdir -p bin
          tar xzf artifacts/zentao-cli-linux-x86_64.tar.gz -C bin
          mv bin/zentao-cli bin/zentao-cli-linux-x86_64
          tar xzf artifacts/zentao-cli-darwin-x86_64.tar.gz -C bin
          mv bin/zentao-cli bin/zentao-cli-darwin-x86_64
          tar xzf artifacts/zentao-cli-darwin-arm64.tar.gz -C bin
          mv bin/zentao-cli bin/zentao-cli-darwin-arm64
          cp artifacts/zentao-cli-windows-x86_64.exe bin/

      - name: Package for npm
        run: |
          cp package.json bin/
          cp README.md bin/
          cp LICENSE bin/

      - name: Publish to npm
        working-directory: bin
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
