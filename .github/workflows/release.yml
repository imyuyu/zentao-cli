name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name: zentao-cli-linux-x64
            binary_name: zentao-cli
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact_name: zentao-cli-linux-arm64
            binary_name: zentao-cli
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: zentao-cli-darwin-x64
            binary_name: zentao-cli
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: zentao-cli-darwin-arm64
            binary_name: zentao-cli
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name: zentao-cli-win32-x64
            binary_name: zentao-cli.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            artifact_name: zentao-cli-win32-arm64
            binary_name: zentao-cli.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release archive
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "release/${{ matrix.binary_name }}"
            powershell -Command "Compress-Archive -Path 'release/${{ matrix.binary_name }}' -DestinationPath 'release/${{ matrix.artifact_name }}.zip'"
            rm "release/${{ matrix.binary_name }}"
          else
            tar czf "release/${{ matrix.artifact_name }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          fi

      - name: Prepare npm vendor payload
        shell: bash
        run: |
          mkdir -p "npm-vendor/${{ matrix.target }}/zentao-cli"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "npm-vendor/${{ matrix.target }}/zentao-cli/${{ matrix.binary_name }}"
          if [[ "${{ matrix.runner }}" != "windows-latest" ]]; then
            chmod +x "npm-vendor/${{ matrix.target }}/zentao-cli/${{ matrix.binary_name }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

      - name: Upload npm vendor payload
        uses: actions/upload-artifact@v4
        with:
          name: npm-vendor-${{ matrix.target }}
          path: npm-vendor
          if-no-files-found: error

  package-skills:
    name: Package Skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package skills
        run: |
          mkdir -p release
          tar czf release/skills.tar.gz skills/

      - name: Upload skills
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: release/skills.tar.gz

  create-release:
    name: Create Release
    needs: [release, package-skills]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZenTao CLI ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-assets:
    name: Publish Assets
    needs: [release, package-skills, create-release]
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: zentao-cli-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: skills-artifact
          pattern: skills

      - name: Upload release artifacts
        run: |
          mkdir -p release
          mv release-artifacts/zentao-cli-linux-x64.tar.gz release/ 2>/dev/null || true
          mv release-artifacts/zentao-cli-linux-arm64.tar.gz release/ 2>/dev/null || true
          mv release-artifacts/zentao-cli-darwin-x64.tar.gz release/ 2>/dev/null || true
          mv release-artifacts/zentao-cli-darwin-arm64.tar.gz release/ 2>/dev/null || true
          mv release-artifacts/zentao-cli-win32-x64.zip release/ 2>/dev/null || true
          mv release-artifacts/zentao-cli-win32-arm64.zip release/ 2>/dev/null || true
          mv skills-artifact/skills.tar.gz release/ 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" release/* --clobber

  publish-npm:
    name: Publish to npm
    needs: [release, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download npm vendor payloads
        uses: actions/download-artifact@v4
        with:
          path: vendor-artifacts
          pattern: npm-vendor-*
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Stage npm packages
        run: |
          python scripts/stage_npm_packages.py \
            --release-version "${{ needs.create-release.outputs.version }}" \
            --package zentao-cli \
            --vendor-src vendor-artifacts \
            --output-dir dist/npm

      - name: Publish root npm package
        run: npm publish dist/npm/zentao-cli-npm-${{ needs.create-release.outputs.version }}.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish platform npm packages
        run: |
          npm publish dist/npm/zentao-cli-npm-linux-x64-${{ needs.create-release.outputs.version }}.tgz --access public
          npm publish dist/npm/zentao-cli-npm-linux-arm64-${{ needs.create-release.outputs.version }}.tgz --access public
          npm publish dist/npm/zentao-cli-npm-darwin-x64-${{ needs.create-release.outputs.version }}.tgz --access public
          npm publish dist/npm/zentao-cli-npm-darwin-arm64-${{ needs.create-release.outputs.version }}.tgz --access public
          npm publish dist/npm/zentao-cli-npm-win32-x64-${{ needs.create-release.outputs.version }}.tgz --access public
          npm publish dist/npm/zentao-cli-npm-win32-arm64-${{ needs.create-release.outputs.version }}.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
