[package]
name = "zentao-cli"
version = "0.0.1-beta.13"
edition = "2021"
description = "ZenTao CLI - Command line tool for ZenTao project management"
license = "MIT"
repository = "https://github.com/imyuyu/zentao-cli"
authors = ["imyuyu"]
readme = "README.md"
keywords = ["zentao", "cli", "project-management", "devops"]
categories = ["command-line-utilities", "project-management"]
rust-version = "1.70"

[[bin]]
name = "zentao-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.26"
crossterm = "0.27"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
rpassword = "7.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2.5"
# 4.1+ 移除了 use_native_store；v1 feature 提供的 Entry::new 内部会自动
# 初始化平台凭据库并 set_default_store
keyring = { version = "4.2", features = ["v1"] }
keyring-core = "1.0"
open = "5.0"

[dev-dependencies]
httpmock = "0.7"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
