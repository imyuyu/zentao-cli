[package]
name = "zentao-cli"
version = "0.0.4"
edition = "2021"
description = "ZenTao CLI - Command line tool for ZenTao project management"
license = "MIT"
repository = "https://github.com/zentao-cli/cli"
authors = ["imyuyu"]
readme = "README.md"
keywords = ["zentao", "cli", "project-management", "devops"]
categories = ["command-line-utilities", "project-management"]
rust-version = "1.70"

[[bin]]
name = "zentao-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.26"
crossterm = "0.27"
confique = "0.4"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
colored = "2.0"
indicatif = "0.17"
keyring = "2.0"
rpassword = "7.3"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
